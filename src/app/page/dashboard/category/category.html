<div class="flex flex-col h-full bg-slate-50 overflow-hidden font-sans antialiased text-slate-900">
  <header
    class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between shrink-0 z-10"
  >
    <div class="flex items-center gap-4">
      <h1 class="text-lg font-bold tracking-tight">Product Categories</h1>
      <span
        class="px-2 py-0.5 rounded bg-blue-50 text-blue-600 text-[10px] font-bold uppercase tracking-widest border border-blue-100"
      >
        {{ totalCategories() }} Total
      </span>
    </div>

    <div class="flex-1 max-w-md mx-8">
      <div class="relative">
        <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </span>
        <input
          (input)="onSearch($event)"
          type="text"
          placeholder="Search categories..."
          class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-xl focus:ring-2 focus:ring-slate-900/5 transition-all outline-none text-sm"
        />
      </div>
    </div>

    <button
      (click)="openModel()"
      class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all active:scale-95 flex items-center gap-2 shadow-lg shadow-slate-200"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Add Category
    </button>
  </header>

  <main class="flex-1 overflow-y-auto p-6 scrollbar-hide">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      @for (cat of categories(); track cat.id) {
        <div
          class="group bg-white border border-slate-200 rounded-4xl p-5 hover:border-slate-300 hover:shadow-xl hover:shadow-slate-200/40 transition-all duration-300 relative"
        >
          <div class="flex justify-between items-start mb-4">
            <div
              class="h-12 w-12 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-slate-900 group-hover:text-white transition-all duration-300"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
                />
              </svg>
            </div>

            <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
              <button
                (click)="onUpdate()"
                class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
                  />
                </svg>
              </button>
              <button
                class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                  />
                </svg>
              </button>
            </div>
          </div>
          <div>
            <h3 class="text-base font-bold text-slate-900 truncate">{{ cat.displayName }}</h3>
            <p class="text-[10px] font-mono text-slate-400 uppercase tracking-tight mb-4">
              /{{ cat.slug }}
            </p>
            <div class="flex items-center justify-between pt-4 border-t border-slate-50">
              <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest"
                >Inventory</span
              >
              <span class="text-xs font-bold px-2 py-0.5 bg-slate-100 rounded-lg text-slate-600"
                >{{ cat.itemCount }} Items</span
              >
            </div>
          </div>
        </div>
      }
    </div>
  </main>

  @if (isModelOpen()) {
    <div class="fixed inset-0 z-100 flex items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-md" (click)="closeModel()"></div>

      <div
        class="bg-white rounded-[3rem] shadow-2xl w-full max-w-2xl relative z-10 overflow-hidden border border-white"
      >
        <div class="px-10 py-8 border-b border-slate-50 flex justify-between items-center">
          <div>
            <h3 class="text-xl font-bold text-slate-900 tracking-tight">
              {{ isEditing() ? 'Edit Group' : 'New Category' }}
            </h3>
            <p class="text-[10px] text-slate-400 uppercase tracking-widest font-black mt-0.5">
              Define product group
            </p>
          </div>
          <button
            (click)="closeModel()"
            class="text-slate-400 hover:text-slate-900 p-2 hover:bg-slate-50 rounded-full transition-all"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="p-10 space-y-6">
          <div class="grid grid-cols-2 gap-x-8 gap-y-5">
            <div class="space-y-5">
              <div>
                <label
                  class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest"
                  >Display Name</label
                >
                <input
                  type="text"
                  formControlName="displayName"
                  placeholder="e.g. Vegetables"
                  class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-2xl focus:border-blue-500 outline-none text-sm transition-all font-bold"
                />
              </div>

              <div>
                <label
                  class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest"
                  >Tagline</label
                >
                <input
                  type="text"
                  formControlName="tagline"
                  placeholder="Fresh from the farm"
                  class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-2xl focus:border-blue-500 outline-none text-sm transition-all"
                />
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label
                    class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest"
                    >Slug</label
                  >
                  <input
                    type="text"
                    formControlName="slug"
                    placeholder="veg-01"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-2xl focus:border-blue-500 outline-none text-xs transition-all font-mono text-blue-600"
                  />
                </div>
                <div>
                  <label
                    class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest"
                    >Visibility</label
                  >
                  <select
                    formControlName="visibility"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-2xl focus:border-blue-500 outline-none text-sm transition-all font-bold appearance-none cursor-pointer"
                  >
                    <option value="PUBLIC">Public</option>
                    <option value="HIDDEN">Hidden</option>
                    <option value="ARCHIVED">Archived</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="space-y-5">
              <div>
                <label
                  class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest"
                  >Icon Identifier</label
                >
                <div class="relative">
                  <input
                    type="text"
                    formControlName="icon"
                    placeholder="leaf-icon"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-2xl focus:border-blue-500 outline-none text-sm transition-all"
                  />
                  <div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path
                        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                      />
                    </svg>
                  </div>
                </div>
              </div>

              <div>
                <label
                  class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest"
                  >SEO Description</label
                >
                <textarea
                  formControlName="seoDescription"
                  rows="4"
                  placeholder="Brief summary for search engines..."
                  class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-2xl focus:border-blue-500 outline-none text-sm transition-all resize-none"
                ></textarea>
              </div>
            </div>
          </div>

          <div class="flex gap-4 pt-4 border-t border-slate-50">
            <button
              type="button"
              (click)="closeModel()"
              class="flex-1 px-6 py-4 text-sm font-bold text-slate-400 hover:text-slate-900 transition-all rounded-2xl"
            >
              Discard
            </button>
            <button
              type="submit"
              [disabled]="categoryForm.invalid"
              class="flex-1 bg-slate-900 text-white px-6 py-4 rounded-2xl text-sm font-bold shadow-xl shadow-slate-200 hover:bg-black disabled:opacity-50 transition-all"
            >
              {{ isEditing() ? 'Update Group' : 'Save Group' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
